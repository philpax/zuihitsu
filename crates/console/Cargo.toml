# The console build pipeline and embedding crate. Building this crate always runs the full
# frontend pipeline (ts-rs export, settings metadata, wasm build, wasm-bindgen, wasm-opt, npm
# install, npm build) from `build.rs`, so the crate has deliberately no `[features]` section:
# including it means you want the console. The root crate depends on it optionally behind the
# `console` feature; the eval crate depends on it directly.
[package]
name = "zuihitsu-console"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
axum = { workspace = true }
rust-embed = { workspace = true }

[build-dependencies]
wasm-bindgen-cli-support = { workspace = true }
wasm-opt = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }